name: CI
on:
  push:
    branches: [main]
  pull_request:

# Read-only, said out loud. Without a permissions block the token gets the
# repository default, which can be read-and-write, and this job checks out with
# credentials kept — so a job that pushes nothing could still have pushed. The
# write-token rule in test/workflows.test.ts treats a missing block as write
# for exactly that reason; declaring `contents: read` is what takes this job
# out of it, and a token that cannot push needs no keeping out of .git/config.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The readiness gate reads back to the last version-bump commit.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: Nothing published is stale
        # Runs on every push, not just at release time, because a release should
        # never be a cleanup job. It fails when regenerating would rewrite a
        # committed artifact — what is published then is not what the data says
        # — or when work that ships bytes has no changelog entry at all.
        # Heuristic findings print without failing: a check that cries wolf is a
        # check people learn to skip.
        run: npx tsx tools/release-readiness.ts
      - name: badge.sh golden tests
        run: ./upstream/tests/badge-test.sh
