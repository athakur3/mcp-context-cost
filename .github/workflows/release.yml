# One dispatch, one release.
#
# Cutting a version used to be a sequence held in someone's head: check what is
# unreleased, regenerate the pages, write the changelog, rename its heading,
# bump two files, commit them separately, push, dispatch the publish, watch it,
# then prove the tarball from npm. Every step was recoverable and none of them
# was hard; the cost was that a missed one is invisible until a reader hits it.
#
# What this does NOT do is publish. `publish.yml` holds npm's trust over OIDC,
# bound to that workflow in this repository, and it is deliberately pinned to
# the configuration a release verifiably shipped through. Restructuring it for
# the convenience of a caller would risk the one path that cannot be tested
# without publishing, so this dispatches it and waits instead — the one event
# a GITHUB_TOKEN is allowed to raise.
name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to cut and publish, e.g. 0.14.0. Must not already exist.'
        required: true
      dry_run:
        description: 'Run every check and stop before the first commit.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write        # to dispatch publish.yml and read its result

# Two releases in flight would race on the version and on the push.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The readiness gate reads back to the last version-bump commit.
          fetch-depth: 0
          # Half of the rule every job holding contents: write follows
          # (resweep.yml states it): the token is not left in .git/config for
          # the whole job. The other half — the token reaches only the step
          # that pushes — this job does NOT meet: `GH_TOKEN` above holds the
          # same token for every step, because `gh workflow run` and `gh run
          # watch` need it. That is acceptable here only because this job runs
          # nothing but this repository's own tools — no servers.yaml entry's
          # launch command executes in it — and the launch-step assertion in
          # test/workflows.test.ts is what holds the two measuring jobs to the
          # stricter form. The persist-credentials line is still kept, because
          # the assertion over every write-token workflow is a rule, and a
          # rule with an exception is a rule the next workflow copies from the
          # wrong file.
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: The version is a version, and is not already cut
        run: |
          set -euo pipefail
          printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "not a version: $VERSION"; exit 2; }
          if git log --format=%s | grep -qF "> $VERSION ("; then
            echo "a bump commit for $VERSION already exists"; exit 1
          fi

      - name: Nothing published is stale
        # The check that makes a release boring. It fails when regen would
        # rewrite a committed artifact — meaning what is published is not what
        # the data says — or when commits that ship bytes have no changelog
        # entry at all. Everything else it finds it prints and does not block.
        run: npx tsx tools/release-readiness.ts

      - name: The suite that prepublishOnly would run anyway
        run: npm run build && npm test && npm run typecheck

      - name: Cut the changelog and bump
        # Two commits, because the second is what tooling and anyone bisecting
        # reads: the bump touches three version fields and nothing else.
        run: |
          set -euo pipefail
          npx tsx tools/cut-changelog.ts "$VERSION"
          git config user.name "mcp-context-cost bot"
          git config user.email "actions@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -q -m "The changelog is cut for $VERSION"
          from=$(node -p "require('./package.json').version")
          npm version "$VERSION" --no-git-tag-version
          # The slot is named in the subject because that is the house form and
          # because it is the one word that says what a reader of the diff should
          # expect: on a 0.x package, minor is where breaking changes live.
          slot=$(node -e "
            const [a,b,c]=process.argv[1].split('.').map(Number), [x,y,z]=process.argv[2].split('.').map(Number);
            console.log(x>a?'major':y>b?'minor':'patch');" "$from" "$VERSION")
          git add package.json package-lock.json
          git commit -q -F - <<EOF
          Version $from -> $VERSION ($slot)

          Written at: package.json['version'], package-lock.json['version'], package-lock.json['packages']['']['version']

          Nothing else is in this commit.
          EOF

      - name: Stop here on a dry run
        if: inputs.dry_run
        run: |
          echo "dry run — the two commits above were made locally and are not pushed."
          git log --oneline -2
          exit 0

      - name: Push the cut
        if: '!inputs.dry_run'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:main

      - name: Publish, and wait for it
        if: '!inputs.dry_run'
        # publish.yml owns the npm trust; this only asks it to run. `workflow_dispatch`
        # is the one event a GITHUB_TOKEN may raise, which is why the split works.
        run: |
          set -euo pipefail
          gh workflow run publish.yml -f version="$VERSION"
          for _ in $(seq 1 30); do
            sleep 10
            id=$(gh run list --workflow=publish.yml --limit 1 --json databaseId,headSha \
                   --jq ".[] | select(.headSha==\"$(git rev-parse HEAD)\") | .databaseId")
            [ -n "$id" ] && break
          done
          [ -n "${id:-}" ] || { echo "publish run never appeared"; exit 1; }
          echo "watching publish run $id"
          gh run watch "$id" --exit-status

      - name: Prove the published tarball re-derives a published number
        if: '!inputs.dry_run'
        # The project's whole claim is that a stranger can re-derive any number
        # it publishes. A release that cannot do that for itself has not been
        # verified, only uploaded. The server is chosen from the data so this
        # never asks about a row that stopped measuring.
        #
        # THIS STEP RUNS AFTER THE PUBLISH, AND FAILING IT ROLLS NOTHING BACK.
        # `$VERSION` is on the registry by the time this starts and stays there.
        # Red here means the tarball has not been *proven* yet — re-run this
        # check, by hand if need be. It never means the release was undone, and
        # anyone reading a red run should not go looking for a rollback.
        run: |
          set -euo pipefail
          server=$(node -e "
            const {readdirSync,readFileSync,existsSync}=require('fs');
            const ok=readdirSync('results',{withFileTypes:true}).filter(d=>d.isDirectory()).map(d=>d.name)
              .filter(n=>{const p='results/'+n+'/measurement.json';
                return existsSync(p) && JSON.parse(readFileSync(p,'utf8')).status==='measured';}).sort();
            if(!ok.length){console.error('no measured server to verify against');process.exit(1);}
            console.log(ok[0]);")
          echo "verifying against $server"
          # Run from an empty directory, deliberately. Inside the checkout the
          # repository's own package.json claims this package's name, so npx
          # resolves the local bin instead of fetching the tarball — which is
          # both an immediate `command not found` and, worse, a check that could
          # have passed while proving nothing about what was published. 0.13.1
          # is where that surfaced. The retry below sits inside this directory
          # for the same reason: a probe run from the checkout would pass
          # instantly and prove nothing.
          cd "$(mktemp -d)"
          # The wait retries the real command rather than a proxy for it, and
          # 0.17.0 is why. This step used to wait on
          # `npm view "mcp-context-cost@$VERSION"` and then run npx; the wait
          # passed on its first attempt and npx failed with ETARGET seconds
          # later. The two do not read the same document. The registry serves a
          # full packument to `Accept: application/json` and an abbreviated one
          # to `application/vnd.npm.install-v1+json` from the same URL under
          # `Vary: accept-encoding, accept` — separately cached objects, each
          # with its own ETag and its own `max-age=300`. `npm view` reads the
          # first; npx resolves against the second. So a green probe on one says
          # nothing about the other, and there is no probe worth keeping: only
          # the command itself resolves the path the command takes.
          #
          # Retrying npx makes progress: its resolution re-fetches rather than
          # reusing what the failed attempt cached. That was measured on npm 11
          # and this job runs npm 10 (setup-node pins Node 22, which bundles
          # 10.9.x), so the schedule does not rest on it. It rests on the part
          # that needs no version at all: seven waits of 45s put the last
          # attempt past the 300s the registry sets on both documents, so it
          # revalidates whatever the earlier ones did.
          attempts=8
          ok=
          for attempt in $(seq 1 "$attempts"); do
            if npx -y "mcp-context-cost@$VERSION" verify --remote \
                 "https://raw.githubusercontent.com/${{ github.repository }}/main/results/$server/measurement.json"; then
              ok=1
              break
            fi
            echo "attempt $attempt of $attempts did not verify — either $VERSION is not being served yet, or the check itself failed"
            if [ "$attempt" -lt "$attempts" ]; then sleep 45; fi
          done
          # Without this the loop falls through with status 0 after its last
          # attempt and the step passes having proved nothing. The wait this
          # replaced had no such guard — and the hazard stayed latent: across
          # the six releases that ran it, it never once exhausted (five times it
          # passed on the first probe, and 0.14.0 waited once). So this guard
          # removes something that could not have reported a failure, not
          # something that ever swallowed one.
          [ -n "${ok:-}" ] || { echo "the published tarball never re-derived $server in $attempts attempts"; exit 1; }

      - name: What is left for a human
        if: '!inputs.dry_run'
        run: |
          echo "Published $VERSION and verified it from npm."
          echo
          echo "Still yours:"
          echo "  - The roadmap, in the operations repository: mark what shipped, and where the plan was wrong."
          echo "  - The v1 Action tag moves only if action.yml changed:"
          echo "      git diff v1 HEAD -- action.yml"
