# Dogfood: measure a reference MCP server with our own harness weekly and
# publish the badge JSON into badges/ — the same pipeline the leaderboard badges use.
name: Self badge
on:
  schedule:
    - cron: '17 6 * * 1' # weekly, Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Measure reference server
        # Version pinned: this job holds contents:write and pushes — never
        # execute an unpinned third-party package here.
        #
        # `--docker` because every other published row is measured that way. A
        # host measurement here would republish results/memory/measurement.json
        # each Monday with a different provenance from the 68 rows beside it,
        # and break that row's own trend line: a sparkline refuses to span a
        # change of isolation (see history.ts), so alternating host/docker
        # sweeps would leave `memory` permanently unable to draw one.
        #
        # The wider timeout covers the cold image pull and package install a
        # fresh runner always pays — no shared cache volume survives between
        # jobs. A container problem is safe: the sweep exits non-zero on a
        # failed measurement, so the job stops here rather than reaching the
        # commit step with a broken badge.
        run: npm run sweep -- --docker --timeout 240000 --name memory --command "npx -y @modelcontextprotocol/server-memory@2026.7.4"
      - name: Refresh Claude divergence column
        # Best-effort: an Anthropic API hiccup here must not block the weekly badge
        # commit below, which is the job's primary purpose.
        continue-on-error: true
        env:
          MCP_CTX_ANTHROPIC_KEY: ${{ secrets.MCP_CTX_ANTHROPIC_KEY }}
        run: npm run divergence
      - name: Regenerate leaderboard + server pages
        # Server pages read results/history.csv for their "Over time" table, so
        # this must run after the sweep above or that table goes stale.
        run: npx tsx src/sweep/regen.ts
      - name: Commit refreshed badge
        # README.md is included because regen patches the numbers the front page
        # states (src/sweep/published-stats.ts) — this job refreshes the Claude
        # divergence run, which moves the count of rows that still match it.
        run: |
          git config user.name "mcp-context-cost bot"
          git config user.email "actions@users.noreply.github.com"
          git add badges/ results/ docs/ README.md
          git diff --cached --quiet || git commit -m "chore: refresh self-badge measurement"
          git push
